<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Dashboard </title>
    <link rel="stylesheet" href="style.css">
</head> 
<body>
    <div class="dashboard">

        <header class="topbar">
            <h1>Dashboard</h1>
            <div class="user">User menu</div>
        </header>

        <aside class="sidebar">
            <nav>
                <a href="#">Overview</a>
                <a href="#">Reports</a>
                <a href="#">Users</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="content">

            <section class="stats">
                <div class="card">Stat 1</div>
                <div class="card">Stat 2</div>
                <div class="card">Stat 3</div>
                <div class="card">Stat 4</div>
            </section>

            <section class="charts">
                <div class="card chart-main">Main chart</div>
                <div class="card chart-side">Side chart</div>
            </section>

            <section class="table-area">
                <div class="card">Table</div>
            </section>

        </main>

    </div>
</body>
</html>
