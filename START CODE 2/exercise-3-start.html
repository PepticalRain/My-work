<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1e90ff;
            display: flex;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100vh;
        }
        
        .main-body {
            display: flex;
            flex-direction: row;
            flex-grow: 1;
            gap: 1em;
        }

        .main-left {
            background-color: #3cb371;
            display: flex;
            flex-grow: 1;
            flex-direction: column;
        }
        
        .side {
            background-color: #ff6347;
            display: flex;
            width: 350px;
        }

        .items {
            display: flex;
            flex-direction: row;
            gap: 1em;
            padding: 0.5em;
            flex-wrap: wrap;
        }

        .item {
            background-color: green;
            width: 100px;
            height: 100px;
            text-align: center;
        }

        .foot {
            background-color: #4169e1;
            display: flex;
            text-align: center;
        }

        header, .main-left, .side, .foot{
            border-radius: 0.5rem;
            padding: 10px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            color: white;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
            font-family: Arial, Helvetica, sans-serif;
        }

    </style>
</head>
<body>
    <div class="container"> 
        <header> header </header>
        <div class="main-body">
            <div class="main-left">
                <p> main </p>
                <div class="items">
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                    <div class="item"> item </div>
                </div>
            </div>
            <div class="side"> sidebar </div>
        </div>
        <div class="foot"> footer </div>
    </div>
</body>
</html>
