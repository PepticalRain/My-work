<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title> cadt.edu.kh </title>
</head>
<body>
    <div class="main">
        <div class="square">
            <div class="border1">
                <div class="Logo">
                    <img src="photo_2026-10-29_11-31-13.jpg" alt="CADT Cambodia Academy of Digital Technology">
                </div>
                
                <form action="/submit" method="post">
                    <div class="in-put">
                        <input type="text" id="name" placeholder="Username or email" required>
                        <input type="text" id="password" placeholder="Password" required>
                    </div>
                </form>

                <div class="Button">
                    <button> Log in </button>
                    <a href=""> Lost password? </a>
                </div>
            </div>

            <div class="border2">
                <p> Sign in with </p>
                <button> Microsoft </button>
            </div>
        </div>
    </div>
</body>
</html>
